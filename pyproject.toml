[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hermes-managed-desktops"
version = "0.2.0"
description = "Experimental Linux/KVM work desktops with explicit guest targeting."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "BearHuddleston, Hermes Agent"}]
# Standalone management/recovery does not require a Hermes installation.
dependencies = ["PyYAML>=6.0.3,<7", "psutil>=7.2.2,<8"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/BearHuddleston/hermes-managed-desktops"
Issues = "https://github.com/BearHuddleston/hermes-managed-desktops/issues"
Documentation = "https://github.com/BearHuddleston/hermes-managed-desktops/blob/main/README.md"

[project.scripts]
hermes-managed-desktops = "managed_desktops.cli:main"

[project.entry-points."hermes_agent.plugins"]
managed-desktops = "managed_desktops"

[tool.hatch.build.targets.wheel]
packages = ["managed_desktops"]

[tool.hatch.build.targets.sdist]
include = [
  "/__init__.py", "/plugin.yaml", "/pyproject.toml", "/README.md",
  "/CONTRIBUTING.md", "/LICENSE", "/managed_desktops", "/scripts", "/tests", "/docs",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/.pytest_cache"]
