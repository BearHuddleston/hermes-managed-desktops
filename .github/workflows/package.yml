name: Stock Hermes compatibility and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Python and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'ruff==0.15.10'
      - run: python -m ruff check managed_desktops scripts tests __init__.py
      - name: Verify and run pinned actionlint
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

  verify:
    name: Stock integration and artifacts (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: plugin
          persist-credentials: false
      - name: Check out exact unmodified stock Hermes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: 8aa219ef60ae16bd130e4775a1513e122880654e
          path: stock-hermes
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and minimal observed harness dependencies
        # pytest is the canonical runner dependency; dotenv/rich are required by
        # stock CLI imports. PyYAML/psutil are the standalone package dependencies.
        # Do not install all Hermes [dev] extras or optional provider dependencies.
        run: >-
          python -m pip install 'build==1.2.2.post1' 'pytest==9.1.1'
          'python-dotenv==1.2.2' 'rich==14.3.3' 'PyYAML==6.0.3' 'psutil==7.2.2'
      - name: Build sdist and wheel from sdist
        run: python -m build --outdir dist
      - name: Verify compatibility and real directory discovery
        # Must precede wheel installation: entry-point discovery can win over a
        # directory copy. The helper also refuses a dirty or wrong-SHA core tree.
        run: python scripts/verify_ci.py --core ../stock-hermes --source user
      - name: Run canonical isolated tests (no KVM guests)
        run: |
          warnings=()
          if [ -f ../stock-hermes/hermes_cli/plugin_compat.py ]; then
            warnings=(-W error::hermes_cli.plugin_compat.HermesPluginCompatWarning)
          fi
          HERMES_PYTHON="$(command -v python)" scripts/run_tests.sh ../stock-hermes --file-retries 0 -j 2 -q "${warnings[@]}"
      - name: Verify installed wheel through stock Hermes
        run: |
          python -m pip install dist/*.whl
          python scripts/verify_ci.py --core ../stock-hermes --source entrypoint
      - name: Verify standalone wheel with no Hermes installed
        run: |
          python -m venv "$RUNNER_TEMP/standalone"
          "$RUNNER_TEMP/standalone/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/standalone/bin/python" scripts/verify_standalone_install.py
      - name: Prepare and verify release checksums and provenance
        run: |
          python scripts/release_bundle.py prepare --dist dist
          python scripts/release_bundle.py verify --dist dist --tag "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
      - name: Upload experimental build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: experimental-distributions-py${{ matrix.python-version }}
          path: |
            plugin/dist/*.whl
            plugin/dist/*.tar.gz
            plugin/dist/BUILD_INFO.json
            plugin/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
