name: Prepare draft prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact package version tag, for example v0.2.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  request:
    name: Validate draft request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Require main, matching version, release notes, and unused tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/release_bundle.py check-tag --tag "$RELEASE_TAG"
          test -f "docs/releases/${RELEASE_TAG#v}.md"
          existing=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          if [ -n "$existing" ]; then
            printf 'Refusing an existing tag: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
      - name: Reject existing drafts as well as published releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/github_draft.py check-available --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"

  verify:
    name: Verify release source
    needs: request
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read

  draft:
    name: Create and verify draft assets
    needs: [request, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'PyYAML==6.0.3'
      - name: Download this run's tested Python 3.11 bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: experimental-distributions-py3.11
          path: dist
      - name: Verify source identity and bundle before granting the CLI a token
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/release_bundle.py verify --dist dist --tag "$RELEASE_TAG"
          existing=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          test -z "$existing"
      - name: Create draft only and verify uploaded bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python scripts/github_draft.py create --repo "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" --dist dist --notes "docs/releases/${RELEASE_TAG#v}.md"
          remote_tag=$(git ls-remote origin "refs/tags/$RELEASE_TAG")
          if [ -n "$remote_tag" ]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
            test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
          fi
